name: Update npm stats

on:
  schedule:
    - cron: "17 1,13 * * *"   # twice a day (UTC); npm fills in recent days late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/npm-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/npm-stats/data.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update npm stats"
          git pull --rebase origin main
          git push
